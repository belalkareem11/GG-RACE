<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>GG RACE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;800;900&display=swap" rel="stylesheet">
<style>
:root{--asp:#23262b;--y:#ffc21a;--t:#17a6a0;--sand:#efe0b4;--br:#c8553d;--u:min(16vmin,92px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Cairo,Tahoma,sans-serif;color:#fff;overscroll-behavior:none}
#stage{position:fixed;inset:0;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}

#money{right:10px;color:var(--y)}#spd{left:10px;direction:ltr}
#nit{position:absolute;top:52px;left:10px;width:min(30vw,150px);height:10px;border:2px solid var(--t);border-radius:8px;overflow:hidden}

#fuel{position:absolute;top:68px;left:10px;width:min(30vw,150px);height:10px;border:2px solid var(--y);border-radius:8px;overflow:hidden}#fuel i{display:block;height:100%;width:100%;background:var(--y)}
#bF{left:calc(3vw + var(--u)*1.8);bottom:calc(5vmin + var(--u)*1.5 + env(safe-area-inset-bottom));border-color:#e55;display:none}
#bU,#bD{right:calc(3vw + var(--u)*.3);display:none;border-color:#9bf}#bU{bottom:calc(5vmin + var(--u)*3.55 + env(safe-area-inset-bottom))}#bD{bottom:calc(5vmin + var(--u)*2.75 + env(safe-area-inset-bottom))}
#msg{position:absolute;top:8px;left:50%;transform:translateX(-50%);max-width:46vw;text-align:center;background:rgba(200,85,61,.85);border-radius:14px;padding:4px 12px;font-weight:800;font-size:clamp(12px,3.2vmin,18px)}

.b.on{background:rgba(255,194,26,.45);border-color:var(--y)}
.b.big{width:calc(var(--u)*1.35);height:calc(var(--u)*1.35)}
.sm{width:calc(var(--u)*.72);height:calc(var(--u)*.72)}
#bL{left:3vw;bottom:calc(5vmin + env(safe-area-inset-bottom))}#bR{left:calc(3vw + var(--u)*1.25);bottom:calc(5vmin + env(safe-area-inset-bottom))}
#bG{right:3vw;bottom:calc(5vmin + env(safe-area-inset-bottom));border-color:var(--t)}
#bB{right:calc(3vw + var(--u)*1.55);bottom:calc(5vmin + env(safe-area-inset-bottom))}
#bH{right:calc(3vw + var(--u)*.4);bottom:calc(5vmin + var(--u)*1.55 + env(safe-area-inset-bottom))}
#bN{right:calc(3vw + var(--u)*1.7);bottom:calc(5vmin + var(--u)*1.1 + env(safe-area-inset-bottom));border-color:#5cf}
#bE{left:3vw;bottom:calc(5vmin + var(--u)*1.5 + env(safe-area-inset-bottom))}
#bC{left:3vw;bottom:calc(5vmin + var(--u)*2.35 + env(safe-area-inset-bottom))}
#bK{left:calc(3vw + var(--u)*.9);bottom:calc(5vmin + var(--u)*1.5 + env(safe-area-inset-bottom))}
#bM{left:calc(3vw + var(--u)*.9);bottom:calc(5vmin + var(--u)*2.35 + env(safe-area-inset-bottom));border-color:var(--y);display:none}
#menu{position:fixed;inset:0;background:linear-gradient(160deg,#1b1d22,#2b2118 60%,#4a2c16);display:flex;align-items:center;justify-content:center;overflow-y:auto;touch-action:pan-y;padding:12px}
#menu.hide{display:none}
.card{width:min(520px,100%);margin:auto;text-align:center}
h1{font-size:clamp(46px,14vmin,92px);margin:0;font-weight:900;letter-spacing:-2px;color:var(--y);transform:skewX(-8deg);text-shadow:4px 4px 0 var(--br)}
h2{margin:0 0 10px;font-size:clamp(22px,6vmin,34px);color:var(--y)}
.sub{color:var(--sand);margin:0 0 18px;font-weight:500}
.btn{display:block;width:100%;margin:10px 0;padding:14px;font:900 clamp(18px,5vmin,26px) Cairo,sans-serif;border:0;border-radius:16px;background:var(--y);color:#222;box-shadow:0 5px 0 #a87a00;min-height:56px}
.btn.g{background:rgba(255,255,255,.12);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(3px)}
.row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:14px;padding:10px 14px;margin:8px 0;text-align:right}
.row b{flex:1;font-size:clamp(15px,4.2vmin,20px)}.row small{display:block;color:var(--sand);font-weight:500}
.row .btn{width:auto;margin:0;padding:8px 14px;font-size:clamp(14px,4vmin,18px);min-height:44px}
.sel{outline:3px solid var(--t)}
</style>
</head>
<body>
<div id="stage"><canvas id="gl" style="position:absolute;inset:0;pointer-events:none"></canvas><canvas id="cv" style="position:absolute;inset:0"></canvas></div>
<div id="hud">
 <div class="pill" id="money"></div><div class="pill" id="spd"></div><div id="nit"><i></i></div><div id="fuel"><i></i></div>
 <div id="msg" style="display:none"></div><div id="toast"></div>
 <button id="pause">☰</button>
</div>
<div id="ctl">
 <div class="b big" id="bL" data-k="L">◀<br>شمال</div><div class="b big" id="bR" data-k="R">يمين<br>▶</div>
 <div class="b big" id="bG" data-k="G">بنزين</div><div class="b" id="bB" data-k="B">فرامل<br>/رجوع</div>
 <div class="b" id="bH" data-k="H">فرملة<br>اليد</div><div class="b" id="bN" data-k="N">نيترو</div>
 <div class="b sm" id="bE" data-a="E">ركوب<br>/نزول</div><div class="b sm" id="bC" data-a="C">كاميرا</div>
 <div class="b sm" id="bU" data-k="U">فوق<br>▲</div><div class="b sm" id="bD" data-k="D">تحت<br>▼</div><div class="b sm" id="bF" data-a="F">ضرب</div><div class="b sm" id="bK" data-a="K">كلاكس</div><div class="b sm" id="bM" data-a="M">الزبون</div>
</div>
<div id="menu"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),cv=$('cv'),cx=cv.getContext('2d');
const TY={taxi:{n:'تاكسي',max:480,acc:300,turn:2.2,w:62,h:30,c:'#ffc21a',p:0},car:{n:'عربية سبورت',max:640,acc:380,turn:2.4,w:64,h:30,c:'#e0402f',p:4000},moto:{n:'موتوسيكل',max:560,acc:430,turn:3.1,w:44,h:16,c:'#2fb4ff',p:1500}};
const UP={e:{n:'موتور أقوى',d:'سرعة وتسارع أعلى',p:600},n:{n:'نيترو أطول',d:'بنزين النيترو يدوم أكتر',p:500},t:{n:'كاوتش أحسن',d:'تماسك أكتر في اللفّات',p:400}};
let S={money:0,own:['taxi'],sel:'taxi',up:{e:0,n:0,t:0},sound:1,touch:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('ggrace1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('ggrace1',JSON.stringify(S))}catch(e){}};
const mobile=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
const setTouch=()=>document.body.classList.toggle('touch',S.touch==2||(S.touch==0&&mobile));
addEventListener('touchstart',()=>{if(S.touch==0){document.body.classList.add('touch')}},{once:true,passive:true});
// state
let K={},G={on:0},P,V=[],cam=0,zoom=1,mis=null,boost=0,nit=100,last=0,tT=0,W=0,H=0,dpr=1,mvx=0;
const rnd=(a,b)=>a+Math.random()*(b-a),fmt=n=>n.toLocaleString('ar-EG');
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(tT);tT=setTimeout(()=>e.style.opacity=0,2200)}
function resize(){dpr=Math.min(devicePixelRatio||1,S.q?2:1.5);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;if(R3)R3.rs()}
addEventListener('resize',resize);
// audio
let AC;function beep(f,d,t='square',v=.08){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
// world
const B=400,RW=70;
const inB=(x,y)=>{if(MODE=='galaxy'||NOB)return 0;if(y>3300)return 1;if(y>=2800)return 0;const a=((x%B)+B)%B,b=((y%B)+B)%B;return a>RW+14&&a<B-RW-14&&b>RW+14&&b<B-RW-14};
const hash=(i,j)=>{let h=(i*374761393+j*668265263)^0x5bd1e995;h=(h^(h>>13))*1274126177;return((h^(h>>16))>>>0)/4294967296};
const PAL=['#c8553d','#d9a05b','#8a9a5b','#b5838d','#6d8ea0','#e0c9a0'];
function veh(t,x,y,a){return{t,x,y,a,vx:0,vy:0,f:100}}
function newGame(){V=[];const k=['taxi','car','moto','micro','taxi','car','micro'];k.forEach((t,i)=>V.push(veh(t,150+i*14*(i%2?-1:1)+(i>2?-220:0),(i%2?-34:34)+(i>3?400:0),i%2?Math.PI:0)));
 V.push(veh(S.sel,40,34,0));P={x:0,y:0,a:0,v:null};P.v=V[V.length-1];mis=null;nit=100;cam=0}
// controls
const act={};
document.querySelectorAll('.b').forEach(b=>{const k=b.dataset.k,a=b.dataset.a;
 b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('on');if(k)K[k]=1;else doAct(a)});
 const up=e=>{b.classList.remove('on');if(k)K[k]=0};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)});
const KM={ArrowLeft:'L',a:'L',ArrowRight:'R',d:'R',ArrowUp:'G',w:'G',ArrowDown:'B',s:'B',' ':'H',Shift:'N'};
addEventListener('keydown',e=>{const k=KM[e.key.length>1?e.key:e.key.toLowerCase()];if(k&&G.on){K[k]=1;e.preventDefault()}
 const A={e:'E',c:'C',h:'K',m:'M',f:'F'}[e.key.toLowerCase()];if(A&&G.on&&!e.repeat)doAct(A);if(e.key=='Escape'&&G.on)pauseMenu()});
addEventListener('keyup',e=>{const k=KM[e.key.length>1?e.key:e.key.toLowerCase()];if(k)K[k]=0});
['gesturestart','gesturechange','dblclick','contextmenu'].forEach(n=>$('stage').addEventListener(n,e=>e.preventDefault()));
// pinch / wheel
const ptr={};let pd=0;
cv.addEventListener('pointerdown',e=>{ptr[e.pointerId]=[e.clientX,e.clientY];pd=0});
cv.addEventListener('pointermove',e=>{if(!ptr[e.pointerId])return;ptr[e.pointerId]=[e.clientX,e.clientY];const p=Object.values(ptr);if(p.length==2){const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);if(pd)zoom=Math.max(.5,Math.min(1.8,zoom*d/pd));pd=d}});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,e=>{delete ptr[e.pointerId];pd=0}));
cv.addEventListener('wheel',e=>{zoom=Math.max(.5,Math.min(1.8,zoom*(e.deltaY>0?.92:1.08)));e.preventDefault()},{passive:false});
// actions
const near=(a,b,d)=>Math.hypot(a.x-b.x,a.y-b.y)<d;
function pos(){return P.v||P}
function doAct(a){if(!G.on)return;
 if(a=='C'){cam=(cam+1)%3;toast(['كاميرا قريبة','كاميرا بعيدة','كاميرا من جوه العربية'][cam])}
 else if(a=='K'){beep(420,.35);beep(520,.35)}
 else if(a=='E'){if(P.v){const v=P.v;if(Math.hypot(v.vx,v.vy)>90)return toast('وقّف العربية الأول!');P.x=v.x-Math.sin(v.a)*45;P.y=v.y+Math.cos(v.a)*45;P.a=v.a;P.v=null;if(mis&&mis.st==1)toast('نزلت من التاكسي والزبون مستني!')}
  else{let b=null,bd=110;V.forEach(v=>{const d=Math.hypot(v.x-P.x,v.y-P.y);if(d<bd){bd=d;b=v}});if(b){P.v=b;toast('ركبت '+TY[b.t].n)}else toast('مفيش عربية قريبة منك')}}
 else if(a=='M'){if(!mis)return;const p=pos();
  if(mis.st==0&&near(p,mis,110)){if(!P.v||P.v.t!='taxi')return toast('اركب تاكسي الأول');mis.st=1;mis.tx=mis.dx;mis.ty=mis.dy;mis.t0=performance.now();toast('الزبون ركب! وصّله بسرعة');beep(660,.15)}
  else if(mis.st==1&&near(p,{x:mis.dx,y:mis.dy},120)){if(Math.random()<.3){mis.st=2;beep(150,.4,'sawtooth');return toast('الزبون رفض يدفع! انزل واضربه')}const el=(performance.now()-mis.t0)/1000,bonus=Math.max(0,Math.round(mis.lim-el))*4,fare=mis.fare+bonus;S.money+=fare;save();toast('وصّلته! +'+fmt(fare)+' جنيه');beep(880,.2,'sine');beep(1100,.3,'sine');mis=null}}}
function spawnMis(){const p=P.v;const ang=rnd(0,6.28),d=rnd(500,1100);const sn=v=>Math.round(v/B)*B;
 const cx0=sn(p.x+Math.cos(ang)*d),cy0=sn(p.y+Math.sin(ang)*d);let dx=cx0+rnd(-300,300)*0,dy;const ang2=rnd(0,6.28),d2=rnd(900,2200);
 mis={st:0,x:cx0+rnd(-40,40),y:cy0+rnd(-40,40)};mis.dx=sn(cx0+Math.cos(ang2)*d2)+rnd(-40,40);mis.dy=sn(cy0+Math.sin(ang2)*d2)+rnd(-40,40);
 const km=Math.hypot(mis.dx-mis.x,mis.dy-mis.y);mis.fare=Math.round(60+km/12);mis.lim=km/260+8}
// physics
function stepVeh(v,dt,inp){const T=TY[v.t],u=S.up;const mx=T.max*(1+.08*u.e)*(boost?1.5:1),ac=(v.f>0?1:0)*T.acc*(1+.08*u.e)*(boost?2:1);
 const c=Math.cos(v.a),s=Math.sin(v.a);let vf=v.vx*c+v.vy*s,vl=-v.vx*s+v.vy*c;
 if(inp){if(K.G)vf=Math.min(mx,vf+ac*dt);else if(K.B){vf-= (vf>10?ac*1.6:ac*.6)*dt;if(vf<-mx*.3)vf=-mx*.3}else vf*=1-.7*dt;
  const st=(K.R?1:0)-(K.L?1:0),sp=Math.max(-1,Math.min(1,vf/120));v.a+=st*T.turn*(K.H?1.5:1)*sp*dt;
  if(K.H){vf*=1-.9*dt;vl*=Math.exp(-1.3*dt)}else vl*=Math.exp(-(8+1.5*u.t)*dt)}
 else{vf*=1-2.5*dt;vl*=Math.exp(-8*dt)}
 const c2=Math.cos(v.a),s2=Math.sin(v.a);v.vx=vf*c2-vl*s2;v.vy=vf*s2+vl*c2;
 const ox=v.x,oy=v.y;v.x+=v.vx*dt;v.y+=v.vy*dt;
 if(inB(v.x,v.y)&&!((v.z||0)>bh(v.x,v.y)+8)){v.x=ox;v.y=oy;v.vx*=-.3;v.vy*=-.3;if(inp&&Math.hypot(vf,vl)>150)beep(90,.15,'sawtooth',.1)}
 return vf}
let vf=0;
function update(dt){
 if(P.v){vf=stepVeh(P.v,dt,1);
  boost=K.N&&nit>0?1:0;nit=boost?Math.max(0,nit-(26-S.up.n*3)*dt):Math.min(100,nit+8*dt);
  P.x=P.v.x;P.y=P.v.y}
 else{const st=(K.R?1:0)-(K.L?1:0);P.a+=st*3*dt;const f=(K.G?1:0)-(K.B?.6:0)*1;const ox=P.x,oy=P.y;P.x+=Math.cos(P.a)*f*140*dt;P.y+=Math.sin(P.a)*f*140*dt;if(inB(P.x,P.y)){P.x=ox;P.y=oy}vf=f*140;boost=0}
 V.forEach(v=>{if(v!==P.v&&!v.ai)stepVeh(v,dt,0)});
 const p=pos();
 if(!mis&&P.v&&(P.v.t=='taxi'||P.v.t=='micro'))spawnMis();
 if(mis&&(!P.v||P.v.t!='taxi')&&mis.st==0){}
 const m=$('msg'),bm=$('bM');let show=0;
 if(mis){m.style.display='block';
  if(mis.st==0){m.textContent='فيه زبون مستنيك! روحله (السهم)';show=near(p,mis,110)}
  else{const el=(performance.now()-mis.t0)/1000;m.textContent='وصّل الزبون – وقت البونص: '+Math.max(0,Math.round(mis.lim-el))+' ث';show=near(p,{x:mis.dx,y:mis.dy},120)}}
 else{m.style.display=P.v?'none':'block';m.textContent='امشي لعربية واضغط ركوب'}
 bm.style.display=show?'flex':'none';bm.firstChild.textContent=mis&&mis.st?'نزّل':'خد';
 if(show&&!document.body.classList.contains('touch')&&!P.__h){P.__h=1;toast('اضغط M للزبون')}
 $('money').textContent='💰 '+fmt(S.money)+' جنيه';$('spd').textContent=Math.round(Math.abs(vf)*.3)+' كم/س';$('nit').firstChild.style.width=nit+'%';
 $('bE').firstChild.textContent=P.v?'نزول':'ركوب';
}
// render
function draw2d(t){
 cx.setTransform(dpr,0,0,dpr,0,0);cx.fillStyle='#2c2f35';cx.fillRect(0,0,W,H);
 const p=pos(),sc=zoom*(cam==1?.62:1)*Math.min(1,Math.max(.65,Math.min(W,H)/700)),ang=cam==2?-p.a-Math.PI/2:0;
 const look=P.v?Math.min(120,Math.hypot(P.v.vx,P.v.vy)*.2):0;
 cx.save();cx.translate(W/2,H/2+(cam==2?H*.18:0));cx.scale(sc,sc);cx.rotate(ang);cx.translate(-p.x,-p.y);
 const R=Math.hypot(W,H)/2/sc+B,i0=Math.floor((p.x-R)/B),i1=Math.floor((p.x+R)/B),j0=Math.floor((p.y-R)/B),j1=Math.floor((p.y+R)/B);
 // lane lines
 cx.strokeStyle='rgba(255,230,150,.55)';cx.lineWidth=4;cx.setLineDash([26,26]);cx.beginPath();
 for(let i=i0;i<=i1+1;i++){cx.moveTo(i*B,j0*B);cx.lineTo(i*B,(j1+1)*B)}for(let j=j0;j<=j1+1;j++){cx.moveTo(i0*B,j*B);cx.lineTo((i1+1)*B,j*B)}cx.stroke();cx.setLineDash([]);
 for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const x=i*B+RW,y=j*B+RW,w=B-2*RW,h=B-2*RW,r=hash(i,j);
  cx.fillStyle=r>.86?'#4c8a55':'#7a6f5f';cx.fillRect(x,y,w,h);
  if(r>.86){cx.fillStyle='#3b6e44';cx.beginPath();cx.arc(x+w/2,y+h/2,60,0,6.3);cx.fill();continue}
  cx.fillStyle=PAL[(r*PAL.length*7|0)%PAL.length];cx.fillRect(x+14,y+14,w-28,h-28);
  cx.fillStyle='rgba(0,0,0,.18)';cx.fillRect(x+14,y+14,w-28,16);
  if(S.q||r<.5){cx.fillStyle='rgba(255,240,170,.35)';for(let a=0;a<4;a++)for(let b=0;b<4;b++)cx.fillRect(x+34+a*((w-80)/3.4),y+46+b*((h-100)/3.4),14,14)}}
 // mission markers
